name: It works on my setup
description: Tell us it works on your distro, so it can go in the README's "Tested on" table
labels: ["tested-on"]
body:
  - type: input
    id: distro
    attributes:
      label: Distro, desktop and display server
      placeholder: e.g. Fedora 43 KDE, Wayland
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Mic firmware (from `emote info`)
      placeholder: e.g. 1.0
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What did you try?
      options:
        - label: Desktop app
        - label: Presets
        - label: Images
        - label: Animated GIFs
        - label: Brightness
        - label: Emote comes back after replugging the mic
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Anything you had to do differently to get it working.
